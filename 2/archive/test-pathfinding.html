<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinding Test Suite</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #4ec9b0;
            border-bottom: 2px solid #4ec9b0;
            padding-bottom: 10px;
        }

        h2 {
            color: #ce9178;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .test-section {
            background-color: #252526;
            border-left: 4px solid #007acc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 3px;
        }

        .console {
            background-color: #1e1e1e;
            border: 1px solid #3e3e42;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 4px 0;
            line-height: 1.5;
        }

        .log-info {
            color: #9cdcfe;
        }

        .log-success {
            color: #4ec9b0;
        }

        .log-warning {
            color: #ce9178;
        }

        .log-error {
            color: #f48771;
        }

        .log-path {
            color: #dcdcaa;
            font-weight: bold;
        }

        .button-group {
            margin: 15px 0;
        }

        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-right: 10px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        button:hover {
            background-color: #005a9e;
        }

        button:active {
            transform: scale(0.98);
        }

        .stats-box {
            background-color: #1e1e1e;
            border: 1px solid #3e3e42;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }

        .stat-line {
            padding: 4px 0;
        }

        .stat-label {
            color: #9cdcfe;
            font-weight: bold;
            min-width: 150px;
            display: inline-block;
        }

        .stat-value {
            color: #dcdcaa;
        }

        .path-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }

        .path-column {
            background-color: #1e1e1e;
            border: 1px solid #3e3e42;
            padding: 10px;
            border-radius: 3px;
        }

        .path-column h3 {
            color: #4ec9b0;
            margin-top: 0;
        }

        .blocked-tile {
            color: #f48771;
            font-weight: bold;
        }

        .test-passed {
            color: #4ec9b0;
            font-weight: bold;
        }

        .test-failed {
            color: #f48771;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧭 Pathfinding Test Suite</h1>

        <div class="test-section">
            <h2>Test Controls</h2>
            <div class="button-group">
                <button onclick="runPathfindingTest()">Run Full Test</button>
                <button onclick="clearConsole()">Clear Console</button>
            </div>
        </div>

        <div class="test-section">
            <h2>Test Output</h2>
            <div class="console" id="testConsole"></div>
        </div>

        <div class="test-section">
            <h2>Agent Statistics</h2>
            <div id="statsOutput"></div>
        </div>

        <div class="test-section">
            <h2>Path Comparison</h2>
            <div class="path-comparison">
                <div class="path-column">
                    <h3>Original Path</h3>
                    <div id="originalPath"></div>
                </div>
                <div class="path-column">
                    <h3>Recalculated Path</h3>
                    <div id="recalculatedPath"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load required modules -->
    <script>
        let scriptsReady = false;
        const scriptLoadState = {
            loaded: [],
            errors: [],
        };

        function loadScriptsSequentially(sources, onComplete) {
            const loadNext = (index) => {
                if (index >= sources.length) {
                    scriptsReady = true;
                    onComplete();
                    return;
                }

                const script = document.createElement('script');
                const cacheBust = `?v=${Date.now()}`;
                script.src = `${sources[index]}${cacheBust}`;
                script.onload = () => {
                    scriptLoadState.loaded.push(sources[index]);
                    loadNext(index + 1);
                };
                script.onerror = () => {
                    console.error(`Failed to load ${sources[index]}`);
                    scriptLoadState.errors.push(sources[index]);
                    scriptsReady = false;
                    onComplete(new Error(`Failed to load ${sources[index]}`));
                };
                document.head.appendChild(script);
            };

            loadNext(0);
        }

        let testConsoleElement = document.getElementById('testConsole');
        let testState = {
            board: null,
            agent1: null,
            agent2: null,
            originalPath: null,
            recalculatedPath: null,
            blockedTile: null,
        };

        /**
         * Log message to test console
         */
        function logConsole(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = message;
            testConsoleElement.appendChild(entry);
            testConsoleElement.scrollTop = testConsoleElement.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        /**
         * Clear test console
         */
        function clearConsole() {
            testConsoleElement.innerHTML = '';
            document.getElementById('statsOutput').innerHTML = '';
            document.getElementById('originalPath').innerHTML = '';
            document.getElementById('recalculatedPath').innerHTML = '';
        }

        /**
         * Format coordinates as string
         */
        function formatCoords(pos) {
            return `(${pos.x},${pos.y})`;
        }

        /**
         * Format path as readable string
         */
        function formatPath(path) {
            if (!path || path.length === 0) {
                return 'EMPTY PATH';
            }
            return path.map(pos => formatCoords(pos)).join(' → ');
        }

        /**
         * Display path in HTML
         */
        function displayPath(path, elementId) {
            const element = document.getElementById(elementId);
            element.innerHTML = '';

            if (!path || path.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'stat-line log-error';
                empty.textContent = 'No path';
                element.appendChild(empty);
                return;
            }

            const container = document.createElement('div');
            container.className = 'stats-box';

            path.forEach((pos, index) => {
                const line = document.createElement('div');
                line.className = 'stat-line';

                const label = document.createElement('span');
                label.className = 'stat-label';
                label.textContent = `Step ${index + 1}:`;

                const value = document.createElement('span');
                value.className = 'stat-value';
                value.textContent = formatCoords(pos);

                // Highlight blocked tiles
                if (testState.blockedTile && 
                    pos.x === testState.blockedTile.x && 
                    pos.y === testState.blockedTile.y) {
                    value.classList.add('blocked-tile');
                    value.textContent += ' [BLOCKED]';
                }

                line.appendChild(label);
                line.appendChild(value);
                container.appendChild(line);
            });

            element.appendChild(container);
        }

        /**
         * Verify path doesn't contain blocked tiles
         */
        function verifyPathAvoidsTile(path, tile) {
            for (const pos of path) {
                if (pos.x === tile.x && pos.y === tile.y) {
                    return false; // Path contains blocked tile
                }
            }
            return true; // Path successfully avoids tile
        }

        /**
         * Run comprehensive pathfinding test
         */
        function runPathfindingTest() {
            clearConsole();
            logConsole('═══════════════════════════════════════', 'info');
            logConsole('PATHFINDING TEST SUITE STARTING', 'info');
            logConsole('═══════════════════════════════════════', 'info');

            try {
                if (!scriptsReady) {
                    logConsole('✗ Scripts not loaded yet. Please wait and try again.', 'error');
                    return;
                }

                const BoardClass = window.Board || (typeof Board !== 'undefined' ? Board : null);
                const AgentClass = window.Agent || (typeof Agent !== 'undefined' ? Agent : null);
                const UtilsLib = window.Utils || (typeof Utils !== 'undefined' ? Utils : null);

                if (!BoardClass || !AgentClass || !UtilsLib) {
                    const missing = [];
                    if (!BoardClass) missing.push('Board');
                    if (!AgentClass) missing.push('Agent');
                    if (!UtilsLib) missing.push('Utils');
                    logConsole(`✗ Required globals not found: ${missing.join(', ')}`, 'error');
                    if (scriptLoadState.errors.length > 0) {
                        logConsole(`✗ Script load errors: ${scriptLoadState.errors.join(', ')}`, 'error');
                    }
                    return;
                }

                // ==================== PHASE 1: Board Generation ====================
                logConsole('', 'info');
                logConsole('PHASE 1: Board Generation', 'info');
                logConsole('─────────────────────────', 'info');

                testState.board = new BoardClass(16, 16);
                testState.board.generate();
                logConsole(`✓ Generated 16×16 board`, 'success');
                logConsole(`✓ Road tiles: ${testState.board.roadTiles.size}`, 'success');
                logConsole(`✓ Intersection tiles: ${testState.board.intersectionTiles.size}`, 'success');

                // ==================== PHASE 2: Agent Creation ====================
                logConsole('', 'info');
                logConsole('PHASE 2: Agent Creation', 'info');
                logConsole('─────────────────────────', 'info');

                // Get random home and job locations
                const homes = testState.board.getSpecialLocations('HOME');
                const offices = testState.board.getSpecialLocations('OFFICE');

                if (homes.length < 2 || offices.length < 2) {
                    logConsole('✗ Not enough HOME/OFFICE tiles on board', 'error');
                    return;
                }

                const agent1Home = homes[0];
                const agent1Job = offices[0];
                const agent2Home = homes[1];
                const agent2Job = offices[1];

                // Create agents with pathfinding
                testState.agent1 = new AgentClass('1', agent1Home, agent1Job, '#ff6b6b', testState.board);
                testState.agent2 = new AgentClass('2', agent2Home, agent2Job, '#4ecdc4', testState.board);

                logConsole(`✓ Created Agent 1`, 'success');
                logConsole(`  Home: ${formatCoords(testState.agent1.homeLocation)}`, 'info');
                logConsole(`  Job:  ${formatCoords(testState.agent1.jobLocation)}`, 'info');
                logConsole(`✓ Created Agent 2`, 'success');
                logConsole(`  Home: ${formatCoords(testState.agent2.homeLocation)}`, 'info');
                logConsole(`  Job:  ${formatCoords(testState.agent2.jobLocation)}`, 'info');

                // ==================== PHASE 3: Initial Pathfinding ====================
                logConsole('', 'info');
                logConsole('PHASE 3: Initial Pathfinding', 'info');
                logConsole('───────────────────────────────', 'info');

                if (testState.agent1.plannedPath.length === 0) {
                    logConsole('✗ Agent 1 has no planned path', 'error');
                    return;
                }

                testState.originalPath = [...testState.agent1.plannedPath];
                logConsole(`✓ Agent 1 path calculated`, 'success');
                logConsole(`  Path length: ${testState.agent1.plannedPath.length} steps`, 'log-path');
                logConsole(`  Path: ${formatPath(testState.agent1.plannedPath)}`, 'log-path');

                if (testState.agent2.plannedPath.length === 0) {
                    logConsole('✗ Agent 2 has no planned path', 'error');
                    return;
                }

                logConsole(`✓ Agent 2 path calculated`, 'success');
                logConsole(`  Path length: ${testState.agent2.plannedPath.length} steps`, 'log-path');
                logConsole(`  Path: ${formatPath(testState.agent2.plannedPath)}`, 'log-path');

                // ==================== PHASE 4: Path Blocking ====================
                logConsole('', 'info');
                logConsole('PHASE 4: Tile Blockage', 'info');
                logConsole('──────────────────────', 'info');

                // Block a tile in the middle of Agent 1's path
                if (testState.agent1.plannedPath.length < 3) {
                    logConsole('✗ Agent 1 path too short to block middle tile', 'error');
                    return;
                }

                const middleIndex = Math.floor(testState.agent1.plannedPath.length / 2);
                const tileToBlock = testState.agent1.plannedPath[middleIndex];
                const tileObj = testState.board.getTile(tileToBlock.x, tileToBlock.y);

                if (tileObj) {
                    tileObj.blockTile(5); // Block for 5 turns
                    testState.blockedTile = tileToBlock;
                    logConsole(`✓ Blocked tile at ${formatCoords(tileToBlock)} (for 5 turns)`, 'success');
                    logConsole(`  This is step ${middleIndex + 1} of Agent 1's original path`, 'warning');
                }

                // ==================== PHASE 5: Path Recalculation ====================
                logConsole('', 'info');
                logConsole('PHASE 5: Path Recalculation', 'info');
                logConsole('────────────────────────────', 'info');

                const recalcSuccess = testState.agent1.recalculatePath(testState.board);

                if (!recalcSuccess) {
                    logConsole('✗ Agent 1 failed to recalculate path', 'error');
                    return;
                }

                testState.recalculatedPath = [...testState.agent1.plannedPath];
                logConsole(`✓ Agent 1 path recalculated`, 'success');
                logConsole(`  New path length: ${testState.agent1.plannedPath.length} steps`, 'log-path');
                logConsole(`  New path: ${formatPath(testState.agent1.plannedPath)}`, 'log-path');

                // ==================== PHASE 6: Verification ====================
                logConsole('', 'info');
                logConsole('PHASE 6: Path Verification', 'info');
                logConsole('──────────────────────────', 'info');

                const originalContainsBlocked = !verifyPathAvoidsTile(testState.originalPath, tileToBlock);
                const recalculatedAvoidsBlocked = verifyPathAvoidsTile(testState.recalculatedPath, tileToBlock);

                logConsole('', 'info');
                if (originalContainsBlocked) {
                    logConsole(`✓ Original path CONTAINS blocked tile (as expected)`, 'success');
                } else {
                    logConsole(`✗ Original path does NOT contain blocked tile (unexpected)`, 'warning');
                }

                if (recalculatedAvoidsBlocked) {
                    logConsole(`✓ Recalculated path AVOIDS blocked tile (SUCCESS)`, 'success');
                } else {
                    logConsole(`✗ Recalculated path STILL CONTAINS blocked tile (FAIL)`, 'error');
                }

                // ==================== PHASE 7: Summary ====================
                logConsole('', 'info');
                logConsole('PHASE 7: Test Summary', 'info');
                logConsole('──────────────────────', 'info');

                const stats = {
                    'Original Path Length': testState.originalPath.length,
                    'Recalculated Path Length': testState.recalculatedPath.length,
                    'Path Length Difference': testState.recalculatedPath.length - testState.originalPath.length,
                    'Blocked Tile': formatCoords(tileToBlock),
                    'Original Contains Blocked': originalContainsBlocked ? 'YES' : 'NO',
                    'Recalculated Avoids Blocked': recalculatedAvoidsBlocked ? 'YES' : 'NO',
                    'Test Result': recalculatedAvoidsBlocked ? 'PASSED ✓' : 'FAILED ✗',
                };

                displayStats(stats);

                logConsole('', 'info');
                logConsole('═══════════════════════════════════════', 'info');
                if (recalculatedAvoidsBlocked) {
                    logConsole('TEST PASSED ✓', 'success');
                } else {
                    logConsole('TEST FAILED ✗', 'error');
                }
                logConsole('═══════════════════════════════════════', 'info');

            } catch (error) {
                logConsole(`✗ Test error: ${error.message}`, 'error');
                console.error(error);
            }

            // Display path comparisons
            if (testState.originalPath) {
                displayPath(testState.originalPath, 'originalPath');
            }
            if (testState.recalculatedPath) {
                displayPath(testState.recalculatedPath, 'recalculatedPath');
            }
        }

        /**
         * Display statistics in HTML
         */
        function displayStats(stats) {
            const statsElement = document.getElementById('statsOutput');
            statsElement.innerHTML = '';

            const container = document.createElement('div');
            container.className = 'stats-box';

            for (const [label, value] of Object.entries(stats)) {
                const line = document.createElement('div');
                line.className = 'stat-line';

                const labelSpan = document.createElement('span');
                labelSpan.className = 'stat-label';
                labelSpan.textContent = `${label}:`;

                const valueSpan = document.createElement('span');
                valueSpan.className = 'stat-value';
                valueSpan.textContent = String(value);

                // Color code test result
                if (label === 'Test Result') {
                    if (value.includes('PASSED')) {
                        valueSpan.classList.add('test-passed');
                    } else {
                        valueSpan.classList.add('test-failed');
                    }
                }

                line.appendChild(labelSpan);
                line.appendChild(valueSpan);
                container.appendChild(line);
            }

            statsElement.appendChild(container);
        }

        // Auto-run test on page load
        window.addEventListener('load', () => {
            const sources = [
                'src/Utils.js',
                'src/Tile.js',
                'src/Board.js',
                'src/Agent.js',
            ];

            loadScriptsSequentially(sources, (err) => {
                if (err) {
                    logConsole(`✗ Script load error: ${err.message}`, 'error');
                    return;
                }

                logConsole(`Scripts loaded: ${scriptLoadState.loaded.join(', ')}`, 'info');
                const globals = [
                    `Utils=${!!window.Utils}`,
                    `Tile=${!!window.Tile}`,
                    `Board=${!!window.Board}`,
                    `Agent=${!!window.Agent}`,
                ];
                logConsole(`Globals: ${globals.join(' | ')}`, 'info');
                logConsole('Scripts loaded. Click "Run Full Test" to begin.', 'info');
            });
        });
    </script>
</body>
</html>
