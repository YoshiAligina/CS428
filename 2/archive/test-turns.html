<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turn Manager Test - Agent Tasks and Movement</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #0a0e27;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #4da6ff;
            margin-bottom: 20px;
            border-bottom: 2px solid #4da6ff;
            padding-bottom: 10px;
        }

        h2 {
            color: #7ac943;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            background-color: #4da6ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        button:disabled {
            background-color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        button.danger {
            background-color: #ff6b6b;
        }

        button.danger:hover {
            background-color: #cc5555;
        }

        .status-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-box {
            background-color: #1a1f3a;
            border: 1px solid #4da6ff;
            border-radius: 4px;
            padding: 15px;
        }

        .status-label {
            color: #4da6ff;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .status-value {
            color: #7ac943;
            font-size: 1.3em;
            font-weight: bold;
        }

        .game-log {
            background-color: #1a1f3a;
            border: 1px solid #4da6ff;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
            max-height: 500px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-left: 3px solid #666;
            padding-left: 10px;
        }

        .log-entry.turn {
            border-left-color: #4da6ff;
            color: #4da6ff;
            font-weight: bold;
        }

        .log-entry.event {
            border-left-color: #ff9999;
            color: #ff9999;
        }

        .log-entry.success {
            border-left-color: #7ac943;
            color: #7ac943;
        }

        .log-entry.warning {
            border-left-color: #ffb366;
            color: #ffb366;
        }

        .agent-status {
            background-color: #0a0e27;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .agent-header {
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .agent-color-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            display: inline-block;
            margin-right: 8px;
        }

        .agent-info {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 5px;
        }

        .agent-status-badge {
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .badge-active {
            background-color: #4da6ff;
            color: white;
        }

        .badge-arrived {
            background-color: #7ac943;
            color: white;
        }

        .badge-failed {
            background-color: #ff6b6b;
            color: white;
        }

        .final-results {
            background-color: #1a3a1a;
            border: 2px solid #7ac943;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .final-results h2 {
            color: #7ac943;
            margin-top: 0;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #333;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #aaa;
        }

        .result-value {
            color: #7ac943;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        .error-box {
            background-color: #3a1a1a;
            border: 2px solid #ff6b6b;
            border-radius: 4px;
            padding: 15px;
            color: #ff6b6b;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Turn Manager Test - Agent Tasks and Movement</h1>

        <div id="errorBox" class="error-box hidden"></div>

        <div class="controls">
            <button id="startBtn">Start Game</button>
            <button id="nextTurnBtn" disabled>Next Turn</button>
            <button id="autoPlayBtn" disabled>Auto Play (15 Turns)</button>
            <button id="resetBtn">Reset Game</button>
            <button id="pauseBtn" disabled>Pause</button>
        </div>

        <div class="status-panel">
            <div class="status-box">
                <div class="status-label">Current Turn</div>
                <div class="status-value" id="turnDisplay">0 / 15</div>
            </div>
            <div class="status-box">
                <div class="status-label">Game Status</div>
                <div class="status-value" id="gameStatus">Ready</div>
            </div>
            <div class="status-box">
                <div class="status-label">Agents Arrived</div>
                <div class="status-value" id="arrivedCount">0 / 4</div>
            </div>
            <div class="status-box">
                <div class="status-label">Agents Failed</div>
                <div class="status-value" id="failedCount">0 / 4</div>
            </div>
        </div>

        <h2>📋 Game Log</h2>
        <div class="game-log" id="gameLog"></div>

        <h2>👥 Agent Status</h2>
        <div id="agentStatusContainer"></div>

        <div id="finalResults" class="final-results hidden">
            <h2>🏁 Final Results</h2>
            <div id="finalResultsContent"></div>
        </div>
    </div>

    <!-- Script Loading -->
    <script>
        // Global error handler
        window.addEventListener('error', (event) => {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = `ERROR: ${event.message} at ${event.filename}:${event.lineno}`;
            errorBox.classList.remove('hidden');
            console.error('Global error:', event.error);
        });

        // Script loader with diagnostics
        const scripts = [
            'src/Tile.js',
            'src/Utils.js',
            'src/Board.js',
            'src/Agent.js',
            'src/TurnManager.js'
        ];

        let loadedCount = 0;
        const scriptOnLoad = () => {
            loadedCount++;
            console.log(`Loaded ${loadedCount}/${scripts.length} scripts`);
            if (loadedCount === scripts.length) {
                console.log('All scripts loaded, running tests...');
                runTests();
            }
        };

        // Load all scripts
        scripts.forEach(script => {
            const el = document.createElement('script');
            el.src = script + `?v=${Date.now()}`;
            el.onload = scriptOnLoad;
            el.onerror = (err) => {
                const errorBox = document.getElementById('errorBox');
                errorBox.textContent = `Failed to load ${script}: ${err}`;
                errorBox.classList.remove('hidden');
                console.error(`Failed to load ${script}:`, err);
            };
            document.head.appendChild(el);
        });
    </script>

    <!-- Test Logic -->
    <script>
        let gameState = {
            board: null,
            agents: [],
            turnManager: null,
            running: false,
            paused: false,
            autoPlaying: false,
            autoPlayInterval: null,
        };

        /**
         * Log a message to the game log
         */
        function log(message, type = 'normal') {
            const gameLog = document.getElementById('gameLog');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = message;
            gameLog.appendChild(entry);
            gameLog.scrollTop = gameLog.scrollHeight;
        }

        /**
         * Update status displays
         */
        function updateStatusDisplay() {
            const state = gameState;
            
            if (!state.turnManager) return;

            const turn = state.turnManager.getTurn();
            const maxTurns = state.turnManager.getMaxTurns();
            document.getElementById('turnDisplay').textContent = `${turn} / ${maxTurns}`;

            const arrived = state.agents.filter(a => a.status === Agent.STATUS.ARRIVED).length;
            const failed = state.agents.filter(a => a.status === Agent.STATUS.FAILED).length;
            
            document.getElementById('arrivedCount').textContent = `${arrived} / 4`;
            document.getElementById('failedCount').textContent = `${failed} / 4`;

            if (!state.running) {
                document.getElementById('gameStatus').textContent = 'Stopped';
            } else if (state.paused) {
                document.getElementById('gameStatus').textContent = 'Paused';
            } else {
                document.getElementById('gameStatus').textContent = 'Running';
            }

            updateAgentStatus();
        }

        /**
         * Update agent status display
         */
        function updateAgentStatus() {
            const container = document.getElementById('agentStatusContainer');
            container.innerHTML = '';

            for (const agent of gameState.agents) {
                const div = document.createElement('div');
                div.className = 'agent-status';

                const stats = agent.getStats();
                const statusClass = `badge-${agent.status.toLowerCase()}`;

                div.innerHTML = `
                    <div class="agent-header">
                        <span>
                            <span class="agent-color-box" style="background-color: ${agent.color}"></span>
                            <strong>${agent.name}</strong>
                        </span>
                        <span class="agent-status-badge ${statusClass}">${agent.status}</span>
                    </div>
                    <div class="agent-info">
                        Position: (${agent.currentLocation.x}, ${agent.currentLocation.y}) | 
                        Job: (${agent.jobLocation.x}, ${agent.jobLocation.y})
                    </div>
                    <div class="agent-info">
                        Time: ${stats.turnsElapsed}/${stats.maxTurns} | 
                        Tasks: ${stats.tasksCompleted}/${stats.tasksRemaining + stats.tasksCompleted} | 
                        Path: ${stats.pathProgress.current}/${stats.pathProgress.total}
                    </div>
                    <div class="agent-info">
                        Home: (${agent.homeLocation.x}, ${agent.homeLocation.y}) | 
                        Arrived: ${agent.arrivedAtJob ? '✓' : '✗'}
                    </div>
                `;

                container.appendChild(div);
            }
        }

        /**
         * Initialize the game
         */
        function initializeGame() {
            log('=== INITIALIZING GAME ===', 'turn');

            // Create board
            gameState.board = new Board(16, 16);
            gameState.board.generate();
            log(`✓ Board created: 16x16 grid`, 'success');

            // Create 4 agents with random locations
            gameState.agents = [];
            const colors = ['#4da6ff', '#ff6b6b', '#7ac943', '#ffb366'];

            for (let i = 1; i <= 4; i++) {
                const homeLocation = gameState.board.getRandomSpecialLocation('HOME');
                const jobLocation = gameState.board.getRandomSpecialLocation('OFFICE');

                if (!homeLocation || !jobLocation) {
                    log(`✗ ERROR: Could not find HOME/OFFICE locations for Agent ${i}`, 'event');
                    continue;
                }

                const agent = new Agent(
                    i,
                    homeLocation,
                    jobLocation,
                    colors[i - 1],
                    gameState.board
                );

                gameState.agents.push(agent);
                log(`✓ Agent ${i} created at (${homeLocation.x}, ${homeLocation.y}) → (${jobLocation.x}, ${jobLocation.y})`, 'success');
            }

            // Create turn manager (which auto-assigns tasks)
            gameState.turnManager = new TurnManager(gameState.agents, gameState.board, {
                maxTurns: 15,
            });

            log(`✓ TurnManager created with 15 max turns`, 'success');
            log(`✓ Random tasks assigned (30% chance per agent for CAFE)`, 'success');

            // Log task assignments
            for (const agent of gameState.agents) {
                if (agent.tasksQueue.length > 0) {
                    const tasks = agent.tasksQueue.map(t => `${t.type}@(${t.location.x},${t.location.y})`).join(', ');
                    log(`  → ${agent.name} has tasks: ${tasks}`, 'warning');
                } else {
                    log(`  → ${agent.name} has no tasks`, 'normal');
                }
            }

            // Start the game (initializes paths and sets gameRunning = true)
            gameState.turnManager.start();
            gameState.running = true;

            updateStatusDisplay();

            // Enable buttons
            document.getElementById('startBtn').disabled = true;
            document.getElementById('nextTurnBtn').disabled = false;
            document.getElementById('autoPlayBtn').disabled = false;
            document.getElementById('resetBtn').disabled = false;

            log('Game started! Ready to execute turns.', 'success');
        }

        /**
         * Execute one turn
         */
        function executeTurn() {
            if (!gameState.turnManager) return;
            if (gameState.turnManager.gameFinished) return;

            const turn = gameState.turnManager.getTurn() + 1;
            log(`\n=== TURN ${turn} ===`, 'turn');

            // Execute turn
            gameState.turnManager.executeTurn();

            // Log agent positions and events
            for (const agent of gameState.agents) {
                const stats = agent.getStats();
                const position = `(${stats.currentLocation.x}, ${stats.currentLocation.y})`;
                const destination = agent.getNextDestination();
                const destStr = `(${destination.x}, ${destination.y})`;

                let statusStr = `${agent.name} at ${position}`;
                
                if (agent.status === Agent.STATUS.ARRIVED) {
                    log(`✓ ${agent.name} ARRIVED at job!`, 'success');
                } else if (agent.status === Agent.STATUS.FAILED) {
                    log(`✗ ${agent.name} FAILED - time limit exceeded`, 'event');
                } else {
                    // Log normal movement
                    if (stats.tasksRemaining > 0) {
                        statusStr += ` → Task: ${destStr} (${stats.tasksRemaining} remaining)`;
                    } else {
                        statusStr += ` → Job: ${destStr}`;
                    }
                    log(`  ${statusStr}`, 'normal');
                }
            }

            updateStatusDisplay();

            // Check if game ended
            if (gameState.turnManager.gameFinished) {
                endGame();
            }
        }

        /**
         * End the game and show results
         */
        function endGame() {
            gameState.running = false;
            gameState.paused = false;

            if (gameState.autoPlayInterval) {
                clearInterval(gameState.autoPlayInterval);
                gameState.autoPlayInterval = null;
            }

            log('\n=== GAME ENDED ===', 'turn');

            const arrived = gameState.agents.filter(a => a.status === Agent.STATUS.ARRIVED);
            const failed = gameState.agents.filter(a => a.status === Agent.STATUS.FAILED);

            log(`\n📊 FINAL RESULTS:`, 'success');
            log(`✓ Agents Arrived: ${arrived.length}`, arrived.length > 0 ? 'success' : 'event');
            log(`✗ Agents Failed: ${failed.length}`, failed.length > 0 ? 'event' : 'success');

            for (const agent of arrived) {
                const stats = agent.getStats();
                log(`  ✓ ${agent.name}: Arrived in ${stats.turnsElapsed} turns, ${stats.tasksCompleted} tasks completed`, 'success');
            }

            for (const agent of failed) {
                const stats = agent.getStats();
                log(`  ✗ ${agent.name}: Failed after ${stats.turnsElapsed} turns`, 'event');
            }

            // Show final results box
            showFinalResults();

            // Disable buttons
            document.getElementById('nextTurnBtn').disabled = true;
            document.getElementById('autoPlayBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = true;
        }

        /**
         * Show final results box
         */
        function showFinalResults() {
            const resultsBox = document.getElementById('finalResults');
            const content = document.getElementById('finalResultsContent');

            const arrived = gameState.agents.filter(a => a.status === Agent.STATUS.ARRIVED);
            const failed = gameState.agents.filter(a => a.status === Agent.STATUS.FAILED);

            let html = '';

            for (const agent of gameState.agents) {
                const stats = agent.getStats();
                const status = agent.status === Agent.STATUS.ARRIVED ? '✓ ARRIVED' : 
                              agent.status === Agent.STATUS.FAILED ? '✗ FAILED' : '◆ ACTIVE';

                html += `
                    <div class="result-row">
                        <div class="result-label">
                            <span style="color: ${agent.color}">■</span> ${agent.name}
                        </div>
                        <div class="result-value">${status} | Turns: ${stats.turnsElapsed}/${stats.maxTurns} | Tasks: ${stats.tasksCompleted}</div>
                    </div>
                `;
            }

            html += `
                <div class="result-row" style="background-color: rgba(0,0,0,0.3); margin-top: 10px; padding-top: 10px; border-top: 2px solid #666;">
                    <div class="result-label">Success Rate</div>
                    <div class="result-value">${arrived.length} / ${gameState.agents.length} agents arrived</div>
                </div>
            `;

            content.innerHTML = html;
            resultsBox.classList.remove('hidden');
        }

        /**
         * Button Event Handlers
         */
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!gameState.turnManager) {
                initializeGame();
            }
        });

        document.getElementById('nextTurnBtn').addEventListener('click', () => {
            if (!gameState.paused) {
                gameState.running = false;
            }
            gameState.paused = false;
            executeTurn();
            updateStatusDisplay();
        });

        document.getElementById('autoPlayBtn').addEventListener('click', () => {
            if (!gameState.autoPlayInterval) {
                gameState.running = true;
                gameState.autoPlaying = true;
                document.getElementById('autoPlayBtn').disabled = true;
                document.getElementById('nextTurnBtn').disabled = true;
                document.getElementById('pauseBtn').disabled = false;

                let turnsExecuted = 0;
                gameState.autoPlayInterval = setInterval(() => {
                    if (turnsExecuted >= 15 || gameState.turnManager.gameFinished) {
                        clearInterval(gameState.autoPlayInterval);
                        gameState.autoPlayInterval = null;
                        gameState.autoPlaying = false;
                        document.getElementById('autoPlayBtn').disabled = false;
                        if (!gameState.turnManager.gameFinished) {
                            document.getElementById('nextTurnBtn').disabled = false;
                        }
                        return;
                    }

                    executeTurn();
                    turnsExecuted++;
                }, 800); // 800ms per turn for better readability
            }
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (gameState.autoPlayInterval) {
                clearInterval(gameState.autoPlayInterval);
                gameState.autoPlayInterval = null;
                gameState.autoPlaying = false;
                gameState.paused = true;
                gameState.running = false;

                document.getElementById('autoPlayBtn').disabled = false;
                document.getElementById('nextTurnBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;

                log('Game paused', 'warning');
                updateStatusDisplay();
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (gameState.autoPlayInterval) {
                clearInterval(gameState.autoPlayInterval);
                gameState.autoPlayInterval = null;
            }

            gameState = {
                board: null,
                agents: [],
                turnManager: null,
                running: false,
                paused: false,
                autoPlaying: false,
                autoPlayInterval: null,
            };

            document.getElementById('gameLog').innerHTML = '';
            document.getElementById('agentStatusContainer').innerHTML = '';
            document.getElementById('finalResults').classList.add('hidden');
            document.getElementById('errorBox').classList.add('hidden');

            document.getElementById('startBtn').disabled = false;
            document.getElementById('nextTurnBtn').disabled = true;
            document.getElementById('autoPlayBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = true;

            document.getElementById('turnDisplay').textContent = '0 / 15';
            document.getElementById('gameStatus').textContent = 'Ready';
            document.getElementById('arrivedCount').textContent = '0 / 4';
            document.getElementById('failedCount').textContent = '0 / 4';

            log('Game reset', 'warning');
        });

        /**
         * Run tests when scripts are loaded
         */
        function runTests() {
            log('All scripts loaded successfully!', 'success');
            log('Click "Start Game" to begin', 'warning');
        }
    </script>
</body>
</html>
