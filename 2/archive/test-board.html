<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Generation Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #4da6ff;
            text-shadow: 0 0 10px #4da6ff;
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #4da6ff;
            background: #1a3a52;
            color: #4da6ff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Courier New', monospace;
        }

        button:hover {
            background: #2d5a8f;
            box-shadow: 0 0 15px #4da6ff;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.98);
        }

        .test-section {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #4da6ff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .test-title {
            color: #ffd43b;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ffd43b;
            padding-bottom: 10px;
        }

        .stat-row {
            margin: 8px 0;
            padding: 8px;
            background: rgba(77, 166, 255, 0.1);
            border-left: 3px solid #4da6ff;
        }

        .stat-label {
            color: #4da6ff;
            font-weight: bold;
            display: inline-block;
            width: 200px;
        }

        .stat-value {
            color: #51cf66;
        }

        .special-locations {
            background: rgba(81, 207, 102, 0.1);
            border-left: 3px solid #51cf66;
            padding: 12px;
            margin-top: 15px;
            border-radius: 4px;
        }

        .location-type {
            color: #ffd43b;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .location-item {
            color: #51cf66;
            margin-left: 15px;
            font-size: 14px;
        }

        .connectivity-check {
            background: rgba(0, 255, 0, 0.1);
            border-left: 3px solid #00ff00;
            padding: 12px;
            margin-top: 15px;
            border-radius: 4px;
        }

        .connectivity-pass {
            color: #51cf66;
            font-weight: bold;
        }

        .connectivity-fail {
            color: #ff6b6b;
            font-weight: bold;
        }

        .console-output {
            background: #000000;
            border: 2px solid #00ff00;
            border-radius: 4px;
            padding: 15px;
            margin-top: 30px;
            max-height: 400px;
            overflow-y: auto;
        }

        .console-title {
            color: #00ff00;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .console-line {
            margin: 3px 0;
            font-size: 12px;
        }

        .error {
            color: #ff6b6b;
        }

        .warning {
            color: #ffd43b;
        }

        .info {
            color: #4da6ff;
        }

        .success {
            color: #51cf66;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏙️ Board Generation Test Suite</h1>

        <div class="controls">
            <button onclick="generateAndTestBoard()">📊 Generate New Board & Test</button>
            <button onclick="clearConsole()">🗑️ Clear Console</button>
        </div>

        <div id="testResults"></div>

        <div class="console-output">
            <div class="console-title">📋 Test Console</div>
            <div id="console"></div>
        </div>
    </div>

    <!-- Import required modules -->
    <script src="src/Utils.js"></script>
    <script src="src/Tile.js"></script>
    <script src="src/Board.js"></script>

    <script>
        // Custom console logging
        let consoleBuffer = [];

        function log(...args) {
            const message = args.map(arg => {
                if (typeof arg === 'object') {
                    return JSON.stringify(arg, null, 2);
                }
                return String(arg);
            }).join(' ');

            consoleBuffer.push(message);
            console.log(...args);
            updateConsoleDisplay();
        }

        function logError(message) {
            consoleBuffer.push(`❌ ERROR: ${message}`);
            console.error(message);
            updateConsoleDisplay();
        }

        function logWarning(message) {
            consoleBuffer.push(`⚠️ WARNING: ${message}`);
            console.warn(message);
            updateConsoleDisplay();
        }

        function logSuccess(message) {
            consoleBuffer.push(`✓ ${message}`);
            console.log(message);
            updateConsoleDisplay();
        }

        function updateConsoleDisplay() {
            const consoleDiv = document.getElementById('console');
            consoleDiv.innerHTML = consoleBuffer
                .map(line => {
                    let className = '';
                    if (line.startsWith('❌')) className = 'error';
                    else if (line.startsWith('⚠️')) className = 'warning';
                    else if (line.startsWith('✓')) className = 'success';
                    else if (line.includes('---')) className = 'info';

                    return `<div class="console-line ${className}">${escapeHtml(line)}</div>`;
                })
                .join('');

            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearConsole() {
            consoleBuffer = [];
            document.getElementById('console').innerHTML = '';
            document.getElementById('testResults').innerHTML = '';
        }

        /**
         * Generate a board and run comprehensive tests
         */
        function generateAndTestBoard() {
            try {
                const resultsDiv = document.getElementById('testResults');
                const testResults = [];

                log('═'.repeat(60));
                log('🎬 Starting Board Generation Test');
                log('═'.repeat(60));

                // Generate 3 boards
                for (let boardNum = 1; boardNum <= 3; boardNum++) {
                    log(`\n📍 Generating Board #${boardNum}...`);

                    const board = new Board(16, 16);
                    board.generate();

                    const result = testBoard(board, boardNum);
                    testResults.push(result);
                }

                // Summary
                log('\n' + '═'.repeat(60));
                log('📊 TEST SUMMARY');
                log('═'.repeat(60));

                let successCount = 0;
                for (let i = 0; i < testResults.length; i++) {
                    const result = testResults[i];
                    const status = result.passed ? '✓ PASS' : '✗ FAIL';
                    log(`Board #${i + 1}: ${status}`);

                    if (result.passed) {
                        successCount++;
                    }

                    if (!result.passed) {
                        for (const issue of result.issues) {
                            logWarning(`  Issue: ${issue}`);
                        }
                    }
                }

                log(`\n✓ ${successCount}/3 boards passed all tests`);
                log('═'.repeat(60) + '\n');

                // Display HTML results
                displayResults(testResults);

            } catch (error) {
                logError(`Board generation failed: ${error.message}`);
                console.error(error);
            }
        }

        /**
         * Test a single board
         */
        function testBoard(board, boardNumber) {
            const result = {
                number: boardNumber,
                passed: true,
                issues: [],
                stats: {},
            };

            try {
                // Test 1: Grid size
                log(`  ✓ Grid size: ${board.width}x${board.height}`);
                result.stats.gridSize = `${board.width}x${board.height}`;

                // Test 2: Road vs Building count
                const stats = board.getStats();
                const roadCount = stats.roads + stats.intersections;
                const buildingCount = stats.buildings;

                log(`  ✓ Roads: ${roadCount} tiles (${((roadCount / stats.totalTiles) * 100).toFixed(1)}%)`);
                log(`  ✓ Buildings: ${buildingCount} tiles (${((buildingCount / stats.totalTiles) * 100).toFixed(1)}%)`);

                result.stats.roads = roadCount;
                result.stats.buildings = buildingCount;
                result.stats.intersections = stats.intersections;

                // Test 3: Special locations
                log('  ✓ Special locations:');

                const homes = board.getSpecialLocations('HOME');
                log(`    - HOMES (${homes.length}): ${formatLocations(homes)}`);
                result.stats.homes = homes;

                const offices = board.getSpecialLocations('OFFICE');
                log(`    - OFFICES (${offices.length}): ${formatLocations(offices)}`);
                result.stats.offices = offices;

                const cafes = board.getSpecialLocations('CAFE');
                log(`    - CAFES (${cafes.length}): ${formatLocations(cafes)}`);
                result.stats.cafes = cafes;

                const hospitals = board.getSpecialLocations('HOSPITAL');
                log(`    - HOSPITALS (${hospitals.length}): ${formatLocations(hospitals)}`);
                result.stats.hospitals = hospitals;

                const landmarks = board.getSpecialLocations('LANDMARK');
                log(`    - LANDMARKS (${landmarks.length}): ${formatLocations(landmarks)}`);
                result.stats.landmarks = landmarks;

                // Test 4: Road connectivity
                log('  ✓ Checking road network connectivity...');

                const connectivity = checkConnectivity(board);

                if (connectivity.connected) {
                    logSuccess(`    All ${connectivity.connectedNodes} road nodes are connected!`);
                    result.stats.connectivity = 'CONNECTED';
                } else {
                    logWarning(`    Network fragmented: ${connectivity.connectedNodes}/${connectivity.totalNodes} nodes connected`);
                    result.passed = false;
                    result.issues.push(`Road network has isolated components (${connectivity.connectedNodes}/${connectivity.totalNodes} connected)`);
                    result.stats.connectivity = 'FRAGMENTED';
                }

                // Test 5: Special location validity
                log('  ✓ Validating special locations...');

                let locationIssues = 0;

                // Check homes
                if (homes.length !== 2) {
                    result.issues.push(`Expected 2 homes, found ${homes.length}`);
                    locationIssues++;
                }

                // Check offices
                if (offices.length !== 2) {
                    result.issues.push(`Expected 2 offices, found ${offices.length}`);
                    locationIssues++;
                }

                // Check cafe
                if (cafes.length !== 1) {
                    result.issues.push(`Expected 1 cafe, found ${cafes.length}`);
                    locationIssues++;
                }

                if (locationIssues === 0) {
                    logSuccess('    All special locations correctly placed');
                } else {
                    logWarning(`    ${locationIssues} location placement issues found`);
                    result.passed = false;
                }

                // Test 6: Adjacency graph validity
                log('  ✓ Checking adjacency graph...');

                const graphSize = board.graph.size;
                if (graphSize > 0) {
                    logSuccess(`    Graph has ${graphSize} nodes`);
                    result.stats.graphNodes = graphSize;
                } else {
                    logError('    Graph is empty!');
                    result.passed = false;
                    result.issues.push('Adjacency graph is empty');
                }

            } catch (error) {
                logError(`Test failed for board #${boardNumber}: ${error.message}`);
                result.passed = false;
                result.issues.push(error.message);
            }

            return result;
        }

        /**
         * Check if road network is fully connected
         */
        function checkConnectivity(board) {
            if (board.graph.size === 0) {
                return {
                    connected: false,
                    connectedNodes: 0,
                    totalNodes: 0,
                };
            }

            // BFS from first node
            const visited = new Set();
            const queue = [Array.from(board.graph.keys())[0]];
            visited.add(queue[0]);

            while (queue.length > 0) {
                const current = queue.shift();
                const neighbors = board.graph.get(current) || [];

                for (const neighbor of neighbors) {
                    if (!visited.has(neighbor)) {
                        visited.add(neighbor);
                        queue.push(neighbor);
                    }
                }
            }

            const totalNodes = board.graph.size;
            const connectedNodes = visited.size;

            return {
                connected: totalNodes === connectedNodes,
                connectedNodes: connectedNodes,
                totalNodes: totalNodes,
            };
        }

        /**
         * Format locations as readable string
         */
        function formatLocations(locations) {
            if (locations.length === 0) {
                return 'NONE';
            }

            return locations.map(loc => `(${loc.x},${loc.y})`).join(', ');
        }

        /**
         * Display test results in HTML
         */
        function displayResults(testResults) {
            const resultsDiv = document.getElementById('testResults');
            let html = '';

            testResults.forEach((result, index) => {
                const statusClass = result.passed ? 'success' : 'error';
                const statusText = result.passed ? '✓ PASSED' : '✗ FAILED';

                html += `
                    <div class="test-section">
                        <div class="test-title" style="color: ${result.passed ? '#51cf66' : '#ff6b6b'};">
                            Board #${index + 1} - ${statusText}
                        </div>

                        <div class="stat-row">
                            <span class="stat-label">Grid Size:</span>
                            <span class="stat-value">${result.stats.gridSize}</span>
                        </div>

                        <div class="stat-row">
                            <span class="stat-label">Roads:</span>
                            <span class="stat-value">${result.stats.roads} tiles (${result.stats.intersections} intersections)</span>
                        </div>

                        <div class="stat-row">
                            <span class="stat-label">Buildings:</span>
                            <span class="stat-value">${result.stats.buildings} tiles</span>
                        </div>

                        <div class="special-locations">
                            <div class="location-type">Special Locations:</div>
                            <div class="location-item">🏠 Homes: ${formatLocations(result.stats.homes)}</div>
                            <div class="location-item">🏢 Offices: ${formatLocations(result.stats.offices)}</div>
                            <div class="location-item">☕ Cafes: ${formatLocations(result.stats.cafes)}</div>
                            <div class="location-item">🏥 Hospitals: ${formatLocations(result.stats.hospitals)}</div>
                            <div class="location-item">🗽 Landmarks: ${formatLocations(result.stats.landmarks)}</div>
                        </div>

                        <div class="connectivity-check">
                            <span class="connectivity-${result.stats.connectivity === 'CONNECTED' ? 'pass' : 'fail'}">
                                🔗 Connectivity: ${result.stats.connectivity}
                            </span>
                            <span style="margin-left: 10px; color: #4da6ff;">(${result.stats.graphNodes} graph nodes)</span>
                        </div>

                        ${result.issues.length > 0 ? `
                            <div style="background: rgba(255, 107, 107, 0.1); border-left: 3px solid #ff6b6b; padding: 12px; margin-top: 15px; border-radius: 4px;">
                                <div style="color: #ff6b6b; font-weight: bold; margin-bottom: 8px;">Issues Found:</div>
                                ${result.issues.map(issue => `<div style="color: #ff9999; margin-left: 15px;">• ${issue}</div>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }

        // Auto-generate boards on page load
        document.addEventListener('DOMContentLoaded', () => {
            log('🎮 Board Generation Test Suite Loaded');
            log('Click "Generate New Board & Test" to start testing\n');
        });
    </script>
</body>
</html>
