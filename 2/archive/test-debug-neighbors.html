<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Neighbors</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
        }
        pre {
            background-color: #252526;
            padding: 10px;
            border-left: 4px solid #007acc;
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px 0;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #005a9e;
        }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        .warning { color: #ce9178; }
        .info { color: #9cdcfe; }
    </style>
</head>
<body>
    <h1>Debug: Neighbor Checking</h1>
    <button onclick="runNeighborTest()">Check Neighbors</button>
    <pre id="output"></pre>

    <script>
        let scriptsReady = false;
        const scriptLoadState = {
            loaded: [],
            errors: [],
        };

        window.addEventListener('error', (event) => {
            const message = event?.message || 'Unknown error';
            const filename = event?.filename || 'unknown file';
            const lineno = event?.lineno || 0;
            const colno = event?.colno || 0;
            log(`Script error: ${message} @ ${filename}:${lineno}:${colno}`, 'error');
        });

        function loadScriptsSequentially(sources, onComplete) {
            const loadNext = (index) => {
                if (index >= sources.length) {
                    scriptsReady = true;
                    onComplete();
                    return;
                }

                const script = document.createElement('script');
                const cacheBust = `?v=${Date.now()}`;
                script.src = `${sources[index]}${cacheBust}`;
                script.onload = () => {
                    scriptLoadState.loaded.push(sources[index]);
                    log(`Loaded: ${sources[index]}`, 'info');
                    loadNext(index + 1);
                };
                script.onerror = () => {
                    console.error(`Failed to load ${sources[index]}`);
                    scriptLoadState.errors.push(sources[index]);
                    log(`Failed to load: ${sources[index]}`, 'error');
                    scriptsReady = false;
                    onComplete(new Error(`Failed to load ${sources[index]}`));
                };
                document.head.appendChild(script);
            };

            loadNext(0);
        }

        function log(msg, type = 'default') {
            const output = document.getElementById('output');
            const className = type ? ` class="${type}"` : '';
            output.innerHTML += `<span${className}>${msg}</span>\n`;
            console.log(`[${type}] ${msg}`);
        }

        function runNeighborTest() {
            document.getElementById('output').innerHTML = '';
            log('═══════════════════════════════════════', 'warning');
            log('DEBUG: Neighbor Test', 'warning');
            log('═══════════════════════════════════════', 'warning');

            try {
                if (!scriptsReady) {
                    log('✗ Scripts not loaded yet. Please wait and try again.', 'error');
                    return;
                }

                const BoardClass = window.Board || (typeof Board !== 'undefined' ? Board : null);
                const UtilsLib = window.Utils || (typeof Utils !== 'undefined' ? Utils : null);
                const TileClass = window.Tile || (typeof Tile !== 'undefined' ? Tile : null);

                if (!BoardClass || !UtilsLib || !TileClass) {
                    const missing = [];
                    if (!BoardClass) missing.push('Board');
                    if (!UtilsLib) missing.push('Utils');
                    if (!TileClass) missing.push('Tile');
                    log(`✗ Required globals not found: ${missing.join(', ')}`, 'error');
                    log(`Board load flag: ${window.__boardLoaded === true ? 'true' : 'false'}`, 'info');
                    if (scriptLoadState.loaded.length > 0) {
                        log(`Loaded scripts: ${scriptLoadState.loaded.join(', ')}`, 'info');
                    }
                    if (scriptLoadState.errors.length > 0) {
                        log(`✗ Script load errors: ${scriptLoadState.errors.join(', ')}`, 'error');
                    }
                    return;
                }

                const board = new BoardClass(16, 16);
                board.generate();
                
                const homes = board.getSpecialLocations('HOME');
                const offices = board.getSpecialLocations('OFFICE');
                
                const home = homes[0];
                const office = offices[0];
                
                log(`\nHome location: (${home.x},${home.y})`, 'success');
                log(`Office location: (${office.x},${office.y})`, 'success');
                
                // Get home tile and check it
                const homeTile = board.getTile(home.x, home.y);
                log(`\nHome tile type: ${homeTile.type}`, 'info');
                log(`Home tile walkable: ${homeTile.isWalkable}`, 'info');
                log(`Home tile blocked: ${homeTile.isBlocked}`, 'info');
                
                // Check home neighbors
                log(`\n--- Checking HOME neighbors at (${home.x},${home.y}) ---`, 'warning');
                const homeNeighbors = UtilsLib.getWalkableNeighbors(board, home.x, home.y);
                log(`Found ${homeNeighbors.length} walkable neighbors`, homeNeighbors.length > 0 ? 'success' : 'error');
                
                for (let i = 0; i < homeNeighbors.length; i++) {
                    const n = homeNeighbors[i];
                    const tile = board.getTile(n.x, n.y);
                    log(`  [${i}] (${n.x},${n.y}): ${tile.type}, walkable=${tile.isWalkable}, blocked=${tile.isBlocked}`, 'info');
                }
                
                // extra check: ensure we didn't include adjacent building tiles if home is itself a building
                log(`\n--- Building adjacency check ---`, 'warning');
                const dirs = [
                    { dx: -1, dy: 0 }, { dx: 1, dy: 0 },
                    { dx: 0, dy: -1 }, { dx: 0, dy: 1 }
                ];
                for (const d of dirs) {
                    const bx = home.x + d.dx;
                    const by = home.y + d.dy;
                    if (board.isValidPosition(bx, by)) {
                        const bt = board.getTile(bx, by);
                        if (bt && bt.type === TileClass.TYPES.BUILDING) {
                            log(`  adjacent building at (${bx},${by}) should NOT be in neighbors`, 'info');
                        }
                    }
                }
                
                // Check each direction manually
                log(`\n--- Manual direction check from HOME (${home.x},${home.y}) ---`, 'warning');
                const directions = [
                    { x: 0, y: -1, name: 'N' },
                    { x: 1, y: 0, name: 'E' },
                    { x: 0, y: 1, name: 'S' },
                    { x: -1, y: 0, name: 'W' },
                ];
                
                for (const dir of directions) {
                    const nx = home.x + dir.x;
                    const ny = home.y + dir.y;
                    const valid = board.isValidPosition(nx, ny);
                    
                    if (!valid) {
                        log(`  ${dir.name} (${nx},${ny}): OUT OF BOUNDS`, 'error');
                        continue;
                    }
                    
                    const tile = board.getTile(nx, ny);
                    if (!tile) {
                        log(`  ${dir.name} (${nx},${ny}): NULL TILE`, 'error');
                        continue;
                    }
                    
                    log(`  ${dir.name} (${nx},${ny}): ${tile.type}`, 'info');
                    log(`       walkable=${tile.isWalkable}, blocked=${tile.isBlocked}`, tile.isWalkable && !tile.isBlocked ? 'success' : 'error');
                }
                
                // Get office tile and check it
                log(`\n--- Checking OFFICE neighbors at (${office.x},${office.y}) ---`, 'warning');
                const officeNeighbors = UtilsLib.getWalkableNeighbors(board, office.x, office.y);
                log(`Found ${officeNeighbors.length} walkable neighbors`, officeNeighbors.length > 0 ? 'success' : 'error');
                
                for (let i = 0; i < officeNeighbors.length; i++) {
                    const n = officeNeighbors[i];
                    const tile = board.getTile(n.x, n.y);
                    log(`  [${i}] (${n.x},${n.y}): ${tile.type}, walkable=${tile.isWalkable}, blocked=${tile.isBlocked}`, 'info');
                }
                
                // Test A* on a simpler path - just one step
                if (homeNeighbors.length > 0) {
                    const neighbor = homeNeighbors[0];
                    log(`\n--- Testing A* to adjacent neighbor (${neighbor.x},${neighbor.y}) ---`, 'warning');
                    const simplePath = UtilsLib.findPath(board, home, neighbor);
                    log(`Path result: ${simplePath.length} steps`, simplePath.length > 0 ? 'success' : 'error');
                    if (simplePath.length > 0) {
                        log(`Path: ${simplePath.map(p => `(${p.x},${p.y})`).join(' → ')}`, 'success');
                    }
                }
                
            } catch (error) {
                log(`✗ EXCEPTION: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
                console.error(error);
            }
        }

        window.addEventListener('load', () => {
            const sources = [
                'src/Utils.js',
                'src/Tile.js',
                'src/Board.js',
                'src/Agent.js',
            ];

            loadScriptsSequentially(sources, (err) => {
                if (err) {
                    log(`✗ Script load error: ${err.message}`, 'error');
                    return;
                }

                log(`Scripts loaded: ${scriptLoadState.loaded.join(', ')}`, 'info');
                const globals = [
                    `Utils=${!!window.Utils}`,
                    `Tile=${!!window.Tile}`,
                    `Board=${!!window.Board}`,
                    `Agent=${!!window.Agent}`,
                ];
                log(`Globals: ${globals.join(' | ')}`, 'info');
                log('Scripts loaded. Click "Check Neighbors" to start.', 'warning');
            });
        });
    </script>
</body>
</html>
